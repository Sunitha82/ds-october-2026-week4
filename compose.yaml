services:
  backend:
    build: .
    command:
      - uvicorn
      - api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build: .
    command:
      - streamlit
      - run
      - streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --browser.gatherUsageStats=false
    environment:
      API_URL: http://backend:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      backend:
        condition: service_healthy